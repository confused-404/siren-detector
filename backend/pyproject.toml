[project]
name = "siren-detector"
version = "0.1.0"
description = ""
authors = [
    {name = "Yves Kloeckner",email = "hosta.gruen@gmail.com"}
]
readme = "README.md"
requires-python = "~=3.11"
dependencies = [
    "pyaudio (>=0.2.14,<0.3.0)",
    "tflite-runtime (>=2.14.0,<3.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "tensorflow (>=2.20.0,<3.0.0)",
    "sounddevice (>=0.5.5,<0.6.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
httpx = "^0.28.1"
pytest = "^8.4.2"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
