[project]
name = "siren-detector"
version = "0.1.0"
description = ""
authors = [
    {name = "Yves Kloeckner",email = "hosta.gruen@gmail.com"}
]
readme = "README.md"
requires-python = "~=3.11"
dependencies = [
    "tflite-runtime (>=2.14.0,<3.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "tensorflow (>=2.20.0,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
httpx = "^0.28.1"
pytest = "^8.4.2"
ruff = "^0.14.0"
mypy = "^1.18.2"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
